# Ajustes propios sobre deploy/all-in-one de OpenMU (no tocamos el submodulo).
# Usar con server/up.ps1
services:
  openmu-startup:
    environment:
      # Para jugar en esta misma PC. Para LAN usar "local"; online, "public" o la IP fija.
      RESOLVE_IP: ${RESOLVE_IP:-loopback}
    # La imagen de Docker Hub inicializa la DB con los puertos viejos (5590x / 55980),
    # y el compose oficial solo publica los nuevos (4590x). Publicamos ambos.
    ports:
      - "55901-55906:55901-55906"
      - "55980:55980"
